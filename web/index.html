    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #0b1118;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      #glcanvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }
      #loading-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0b1118;
        z-index: 1000;
        transition:
          opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1),
          visibility 0.45s;
        user-select: none;
      }
      #loading-overlay.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .spinner-wrapper {
        position: relative;
        width: 104px;
        height: 104px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .spinner-track {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.06);
      }
      .spinner-arc {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: #f97316;
        border-right-color: #38bdf8;
        filter: drop-shadow(0 0 10px rgba(249, 115, 22, 0.45))
          drop-shadow(0 0 8px rgba(56, 189, 248, 0.35));
        animation: spin-clockwise 1.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }
      .spinner-arc-inner {
        position: absolute;
        inset: 7px;
        border-radius: 50%;
        border: 2px dashed rgba(56, 189, 248, 0.35);
        animation: spin-counter-clockwise 3.6s linear infinite;
      }
      .spinner-core {
        position: relative;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
        box-shadow:
          0 0 20px rgba(0, 0, 0, 0.6),
          inset 0 0 8px rgba(255, 255, 255, 0.06);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        animation: core-pulse 2.2s ease-in-out infinite;
      }
      .spinner-icon {
        width: 42px;
        height: 42px;
        object-fit: contain;
        border-radius: 8px;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
      }

      @keyframes spin-clockwise {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes spin-counter-clockwise {
        from {
          transform: rotate(360deg);
        }
        to {
          transform: rotate(0deg);
        }
      }
      @keyframes core-pulse {
        0%,
        100% {
          transform: scale(0.96);
          box-shadow: 0 0 15px rgba(249, 115, 22, 0.2);
        }
        50% {
          transform: scale(1.04);
          box-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
        }
      }
    </style>
  </head>
  <body>
    <canvas id="glcanvas" tabindex="1"></canvas>

    <div id="loading-overlay">
      <div class="spinner-wrapper">
        <div class="spinner-track"></div>
        <div class="spinner-arc"></div>
        <div class="spinner-arc-inner"></div>
        <div class="spinner-core">
          <img src="icon-192.png" alt="Fox and Hounds" class="spinner-icon" />
        </div>
      </div>
    </div>

    <script>
      const APP_VERSION = '1.3.0';

      window.gameAudioCtx = null;
      window.gameAudioUnlocked = false;

      const fetchedBuffers = {};
      const audioBuffers = {};

      function getGameAudioCtx() {
        if (!window.gameAudioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            window.gameAudioCtx = new AudioCtx();
          }
        }
        return window.gameAudioCtx;
      }

      async function decodeSound(ctx, name) {
        if (audioBuffers[name]) return audioBuffers[name];

        if (fetchedBuffers[name]) {
          try {
            const decoded = await ctx.decodeAudioData(fetchedBuffers[name].slice(0));
            audioBuffers[name] = decoded;
            return decoded;
          } catch (e) {
            console.error('decodeAudioData failed for ' + name, e);
          }
        }

        try {
          const resp = await fetch(`assets/${name}.wav`);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const buf = await resp.arrayBuffer();
          fetchedBuffers[name] = buf;
          const decoded = await ctx.decodeAudioData(buf.slice(0));
          audioBuffers[name] = decoded;
          return decoded;
        } catch (e) {
          console.error('Failed to load sound ' + name, e);
        }
        return null;
      }

      (function preloadBytes() {
        const files = ['move', 'select', 'invalid', 'win', 'loss', 'click', 'train'];
        for (const file of files) {
          fetch(`assets/${file}.wav`)
            .then((r) => {
              if (!r.ok) throw new Error(`HTTP ${r.status}`);
              return r.arrayBuffer();
            })
            .then((b) => {
              fetchedBuffers[file] = b;
              const ctx = getGameAudioCtx();
              if (ctx) {
                ctx.decodeAudioData(
                  b.slice(0),
                  (dec) => {
                    audioBuffers[file] = dec;
                  },
                  (err) => console.warn('Initial decode error for ' + file, err)
                );
              }
            })
            .catch((e) => console.warn('Preload warning for ' + file, e));
        }
      })();

      function unlockAudioContext() {
        let ctx = getGameAudioCtx();
        if (!ctx) return;

        if (ctx.state === 'suspended') {
          ctx.resume().catch(() => {});
        }

        if (!window.gameAudioUnlocked) {
          try {
            const buffer = ctx.createBuffer(1, 1, 22050);
            const source = ctx.createBufferSource();
            source.buffer = buffer;
            source.connect(ctx.destination);
            if (source.start) source.start(0);
            else if (source.play) source.play(0);

            window.gameAudioUnlocked = true;
          } catch (e) {}
        }
      }

      ['click', 'mousedown', 'pointerdown', 'keydown', 'touchstart', 'touchend'].forEach((evt) => {
        window.addEventListener(
          evt,
          (e) => {
            if (
              e.type === 'keydown' &&
              (e.key === 'Meta' || e.key === 'Control' || e.key === 'Alt' || e.key === 'Shift')
            ) {
              return;
            }
            unlockAudioContext();
          },
          { capture: true, passive: true }
        );
      });

      window.gamePlaySound = function (type) {
        let ctx = getGameAudioCtx();
        if (!ctx) return;

        if (ctx.state === 'suspended') {
          ctx
            .resume()
            .then(() => playBuffer(ctx, type))
            .catch((e) => console.warn('Audio blocked', e));
        } else {
          playBuffer(ctx, type);
        }
      };

      async function playBuffer(ctx, type) {
        let buffer = audioBuffers[type];
        if (!buffer) {
          buffer = await decodeSound(ctx, type);
        }
        if (!buffer) return;

        try {
          let source = ctx.createBufferSource();
          source.buffer = buffer;
          let gain = ctx.createGain();
          gain.gain.value = 0.8;
          source.connect(gain);
          gain.connect(ctx.destination);
          source.start(0);
        } catch (e) {
          console.error('Audio playback failed for ' + type, e);
        }
      }
    </script>
    <script>
      // Load mq_js_bundle.js with version cache busting
      const script = document.createElement('script');
      script.src = `mq_js_bundle.js?v=${APP_VERSION}`;
      script.onload = function () {
        miniquad_add_plugin({
          register_plugin: function (env_obj) {
            env_obj.env.play_sound_move = function () {
              if (window.gamePlaySound) window.gamePlaySound('move');
            };
            env_obj.env.play_sound_select = function () {
              if (window.gamePlaySound) window.gamePlaySound('select');
            };
            env_obj.env.play_sound_invalid = function () {
              if (window.gamePlaySound) window.gamePlaySound('invalid');
            };
            env_obj.env.play_sound_win = function () {
              if (window.gamePlaySound) window.gamePlaySound('win');
            };
            env_obj.env.play_sound_loss = function () {
              if (window.gamePlaySound) window.gamePlaySound('loss');
            };
            env_obj.env.play_sound_click = function () {
              if (window.gamePlaySound) window.gamePlaySound('click');
            };
            env_obj.env.play_sound_train = function () {
              if (window.gamePlaySound) window.gamePlaySound('train');
            };
          },
          version: 1,
          name: 'game_audio',
        });
        miniquad_add_plugin({
          register_plugin: function (env_obj) {
            env_obj.env.game_get_system_language = function () {
              const lang = (
                navigator.language ||
                (navigator.languages && navigator.languages[0]) ||
                'en'
              ).toLowerCase();
              if (lang.startsWith('ru')) return 1;
              if (lang.startsWith('es')) return 2;
              if (lang.startsWith('de')) return 3;
              if (lang.startsWith('fr')) return 4;
              if (lang.startsWith('ja') || lang.startsWith('jp')) return 5;
              if (lang.startsWith('zh') || lang.startsWith('cn')) return 6;
              if (lang.startsWith('ko') || lang.startsWith('kr')) return 7;
              if (lang.startsWith('it')) return 8;
              if (lang.startsWith('pt') || lang.startsWith('br')) return 9;
              return 0; // Default en-US
            };
          },
          on_init: function () {
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                const loader = document.getElementById('loading-overlay');
                if (loader && !loader.classList.contains('fade-out')) {
                  loader.classList.add('fade-out');
                  loader.addEventListener(
                    'transitionend',
                    () => {
                      loader.remove();
                      const canvas = document.getElementById('glcanvas');
                      if (canvas) canvas.focus();
                    },
                    { once: true }
                  );
                }
              });
            });
          },
          version: 1,
          name: 'game_locale',
        });
        load(`fox-and-hounds.wasm?v=${APP_VERSION}`);
      };
      document.head.appendChild(script);
    </script>
  </body>
