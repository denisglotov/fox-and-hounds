<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fox and Hounds - Tactical Graph Strategy</title>
    <meta
      name="description"
      content="Fox and Hounds (Лиса и Гончие) asymmetric turn-based graph strategy game written in Rust & Macroquad, compiled to WebAssembly."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e65100'><circle cx='12' cy='12' r='10' fill='%23ff9800'/><text x='12' y='16' font-size='12' text-anchor='middle' fill='white'>🦊</text></svg>"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0b1118;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #glcanvas {
        width: 100%;
        height: 100%;
        max-width: 1000px;
        max-height: 960px;
        display: block;
        outline: none;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <canvas id="glcanvas" tabindex="1"></canvas>

    <script>
      window.gameAudioCtx = null;
      window.gameAudioUnlocked = false;

      const fetchedBuffers = {};
      const audioBuffers = {};

      (function preloadBytes() {
        const files = [
          "move",
          "select",
          "invalid",
          "win",
          "loss",
          "click"
        ];
        for (const file of files) {
          fetch(`assets/${file}.wav`)
            .then((r) => r.arrayBuffer())
            .then((b) => (fetchedBuffers[file] = b))
            .catch((e) => console.error(e));
        }
      })();

      async function decodeAll(ctx) {
        for (const [file, buffer] of Object.entries(fetchedBuffers)) {
          if (!audioBuffers[file]) {
            try {
              audioBuffers[file] = await ctx.decodeAudioData(buffer.slice(0));
            } catch (e) {}
          }
        }
      }

      function getGameAudioCtx() {
        if (!window.gameAudioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            window.gameAudioCtx = new AudioCtx();
            decodeAll(window.gameAudioCtx);
          }
        }
        return window.gameAudioCtx;
      }

      function unlockAudioContext() {
        let ctx = getGameAudioCtx();
        if (!ctx) return;
        if (ctx.state === "suspended") {
          ctx.resume().then(() => {
            window.gameAudioUnlocked = true;
          });
        } else {
          window.gameAudioUnlocked = true;
        }
      }

      ["click", "touchstart", "keydown", "mousedown"].forEach((evt) => {
        window.addEventListener(evt, unlockAudioContext, { once: false, passive: true });
      });

      function playWebSound(name, volume = 0.5) {
        let ctx = getGameAudioCtx();
        if (!ctx) return;
        if (ctx.state === "suspended") {
          ctx.resume();
        }

        let buffer = audioBuffers[name];
        if (buffer) {
          try {
            const src = ctx.createBufferSource();
            src.buffer = buffer;
            const gain = ctx.createGain();
            gain.gain.value = volume;
            src.connect(gain);
            gain.connect(ctx.destination);
            src.start(0);
          } catch (e) {
            console.error("Audio playback error:", e);
          }
        } else if (fetchedBuffers[name]) {
          ctx.decodeAudioData(fetchedBuffers[name].slice(0)).then((dec) => {
            audioBuffers[name] = dec;
            playWebSound(name, volume);
          });
        }
      }

      window.play_sound_move = () => playWebSound("move", 0.55);
      window.play_sound_select = () => playWebSound("select", 0.45);
      window.play_sound_invalid = () => playWebSound("invalid", 0.6);
      window.play_sound_win = () => playWebSound("win", 0.65);
      window.play_sound_loss = () => playWebSound("loss", 0.65);
      window.play_sound_click = () => playWebSound("click", 0.4);
    </script>
    <script src="mq_js_bundle.js"></script>
    <script>
      load("fox-and-hounds.wasm");
    </script>
  </body>
</html>
