<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Fox and Hounds - Tactical Graph Strategy</title>
    <meta
      name="description"
      content="Fox and Hounds (Лиса и Гончие) asymmetric turn-based graph strategy game written in Rust & Macroquad, compiled to WebAssembly."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e65100'><circle cx='12' cy='12' r='10' fill='%23ff9800'/><text x='12' y='16' font-size='12' text-anchor='middle' fill='white'>🦊</text></svg>"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #0b1118;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      #glcanvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="glcanvas" tabindex="1"></canvas>

    <script>
      window.gameAudioCtx = null;
      window.gameAudioUnlocked = false;

      const fetchedBuffers = {};
      const audioBuffers = {};

      function getGameAudioCtx() {
        if (!window.gameAudioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            window.gameAudioCtx = new AudioCtx();
          }
        }
        return window.gameAudioCtx;
      }

      async function decodeSound(ctx, name) {
        if (audioBuffers[name]) return audioBuffers[name];

        if (fetchedBuffers[name]) {
          try {
            const decoded = await ctx.decodeAudioData(
              fetchedBuffers[name].slice(0),
            );
            audioBuffers[name] = decoded;
            return decoded;
          } catch (e) {
            console.error("decodeAudioData failed for " + name, e);
          }
        }

        try {
          const resp = await fetch(`assets/${name}.wav`);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const buf = await resp.arrayBuffer();
          fetchedBuffers[name] = buf;
          const decoded = await ctx.decodeAudioData(buf.slice(0));
          audioBuffers[name] = decoded;
          return decoded;
        } catch (e) {
          console.error("Failed to load sound " + name, e);
        }
        return null;
      }

      (function preloadBytes() {
        const files = ["move", "select", "invalid", "win", "loss", "click"];
        for (const file of files) {
          fetch(`assets/${file}.wav`)
            .then((r) => {
              if (!r.ok) throw new Error(`HTTP ${r.status}`);
              return r.arrayBuffer();
            })
            .then((b) => {
              fetchedBuffers[file] = b;
              const ctx = getGameAudioCtx();
              if (ctx) {
                ctx.decodeAudioData(
                  b.slice(0),
                  (dec) => {
                    audioBuffers[file] = dec;
                  },
                  (err) =>
                    console.warn("Initial decode error for " + file, err),
                );
              }
            })
            .catch((e) => console.warn("Preload warning for " + file, e));
        }
      })();

      function unlockAudioContext() {
        let ctx = getGameAudioCtx();
        if (!ctx) return;

        if (ctx.state === "suspended") {
          ctx.resume().catch(() => {});
        }

        if (!window.gameAudioUnlocked) {
          try {
            const buffer = ctx.createBuffer(1, 1, 22050);
            const source = ctx.createBufferSource();
            source.buffer = buffer;
            source.connect(ctx.destination);
            if (source.start) source.start(0);
            else if (source.play) source.play(0);

            window.gameAudioUnlocked = true;
          } catch (e) {}
        }
      }

      [
        "click",
        "mousedown",
        "pointerdown",
        "keydown",
        "touchstart",
        "touchend",
      ].forEach((evt) => {
        window.addEventListener(
          evt,
          (e) => {
            if (
              e.type === "keydown" &&
              (e.key === "Meta" ||
                e.key === "Control" ||
                e.key === "Alt" ||
                e.key === "Shift")
            ) {
              return;
            }
            unlockAudioContext();
          },
          { capture: true, passive: true },
        );
      });

      window.gamePlaySound = function (type) {
        let ctx = getGameAudioCtx();
        if (!ctx) return;

        if (ctx.state === "suspended") {
          ctx
            .resume()
            .then(() => playBuffer(ctx, type))
            .catch((e) => console.warn("Audio blocked", e));
        } else {
          playBuffer(ctx, type);
        }
      };

      async function playBuffer(ctx, type) {
        let buffer = audioBuffers[type];
        if (!buffer) {
          buffer = await decodeSound(ctx, type);
        }
        if (!buffer) return;

        try {
          let source = ctx.createBufferSource();
          source.buffer = buffer;
          let gain = ctx.createGain();
          gain.gain.value = 0.8;
          source.connect(gain);
          gain.connect(ctx.destination);
          source.start(0);
        } catch (e) {
          console.error("Audio playback failed for " + type, e);
        }
      }
    </script>
    <script>
      // Load mq_js_bundle.js with cache busting
      const script = document.createElement("script");
      script.src = "mq_js_bundle.js?t=" + Date.now();
      script.onload = function () {
        miniquad_add_plugin({
          register_plugin: function (env_obj) {
            env_obj.env.play_sound_move = function () {
              if (window.gamePlaySound) window.gamePlaySound("move");
            };
            env_obj.env.play_sound_select = function () {
              if (window.gamePlaySound) window.gamePlaySound("select");
            };
            env_obj.env.play_sound_invalid = function () {
              if (window.gamePlaySound) window.gamePlaySound("invalid");
            };
            env_obj.env.play_sound_win = function () {
              if (window.gamePlaySound) window.gamePlaySound("win");
            };
            env_obj.env.play_sound_loss = function () {
              if (window.gamePlaySound) window.gamePlaySound("loss");
            };
            env_obj.env.play_sound_click = function () {
              if (window.gamePlaySound) window.gamePlaySound("click");
            };
          },
          version: 1,
          name: "game_audio",
        });
        load("fox-and-hounds.wasm?t=" + Date.now());
      };
      document.head.appendChild(script);
    </script>
  </body>
</html>
