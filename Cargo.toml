[package]
name = "foxandhounds"
version = "1.5.0"
edition = "2021"
authors = ["Dymka"]
description = "Fox and Hounds - Turn-Based Asymmetric Graph Strategy Game"

[lib]
name = "fox_and_hounds"

[dependencies]
macroquad = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
macroquad = { version = "0.4", features = ["audio"] }

[package.metadata.android]
package_name = "org.dymka.foxandhounds"
label = "Fox and Hounds"
version_code = 10
version_name = "1.5"

android_version = 36
target_sdk_version = 36
min_sdk_version = 24
assets = "assets/"
res = "res"
icon = "@mipmap/ic_launcher"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.application_attributes]
"android:localeConfig" = "@xml/locales_config"
"android:banner" = "@drawable/banner"
"android:isGame" = "true"
"android:appCategory" = "game"

[package.metadata.android.activity_attributes]
"android:exported" = "true"
"android:configChanges" = "orientation|screenSize|screenLayout|keyboard|keyboardHidden|navigation|uiMode"

[[package.metadata.android.feature]]
name = "android.hardware.touchscreen"
required = false

[[package.metadata.android.feature]]
name = "android.software.leanback"
required = false

[[package.metadata.android.feature]]
name = "android.hardware.gamepad"
required = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = 1
strip = false
