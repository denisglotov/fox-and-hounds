[package]
name = "fox-and-hounds"
version = "1.0.0"
edition = "2021"
authors = ["Dymka"]
description = "Fox and Hounds - Turn-Based Asymmetric Graph Strategy Game"
default-run = "foxandhounds"

[dependencies]
macroquad = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "foxandhounds"
path = "src/main.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
macroquad = { version = "0.4", features = ["audio"] }

[package.metadata.android]
package_name = "org.dymka.foxandhounds"
label = "Fox and Hounds"
version_code = 1
version_name = "1.0"
android_version = 35
target_sdk_version = 35
min_sdk_version = 23
assets = "assets/"
res = "res"
icon = "@mipmap/ic_launcher"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.application_attributes]
"android:localeConfig" = "@xml/locales_config"

[package.metadata.android.activity_attributes]
"android:exported" = "true"

[[package.metadata.android.bin]]
name = "foxandhounds"
package_name = "org.dymka.foxandhounds"
label = "Fox and Hounds"
version_code = 1
version_name = "1.0"
assets = "assets/"
res = "res"
icon = "@mipmap/ic_launcher"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = 1
strip = false
